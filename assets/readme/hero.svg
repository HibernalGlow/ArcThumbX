<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ArcThumbX</title>
  <desc id="hero-desc">Bilingual title board. ArcThumbX shows archive and ebook covers as real
    thumbnails inside Windows Explorer and macOS Finder. On the right, six cover tiles are drawn the
    way the product draws them: a format-coloured frame (amber for archives, blue for ebooks) with a
    corner chip reading CBZ, EPUB, CBR, FB2, 7Z or AZW3.</desc>

  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222933"/>
      <stop offset="1" stop-color="#161A21"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#101318"/>
  <line x1="662" y1="40" x2="662" y2="380" stroke="#232A34" stroke-width="2"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="74" fill="#8A94A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="3">RUST CORE · TWO SHELL BACKENDS</text>

    <text x="56" y="158" font-size="82" font-weight="700" fill="#EDF1F6" letter-spacing="-1">ArcThumb<tspan fill="#F0C346">X</tspan></text>

    <text x="56" y="206" font-size="27" fill="#DCE3EC">Archive and ebook covers as real thumbnails,</text>
    <text x="56" y="240" font-size="27" fill="#DCE3EC">shown inside your file manager.</text>

    <text x="56" y="288" font-size="24" fill="#A9B3C0">压缩包与电子书封面，直接显示在文件管理器里。</text>

    <text x="56" y="340" fill="#8A94A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18">Windows 10/11 · macOS 11+ · v0.12.0</text>
    <text x="56" y="370" fill="#6F7A89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18">MIT OR Apache-2.0</text>
  </g>

