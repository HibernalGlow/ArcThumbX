# Release: build portable zip on version tags.
#
# Triggers on `v*` tag pushes (e.g. `git tag v0.8.0 && git push --tags`).
# Produces a portable zip with the DLL, config GUI, and license files —
# no installer needed. Users extract, run `arcthumb-config.exe --install`,
# and the shell extension registers.
#
# The zip is uploaded as a GitHub Release asset so it shows up on the
# Releases page automatically.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --features wic -- -D warnings

      - name: Test
        run: cargo test

      - name: Test (wic feature)
        run: cargo test --features wic

      - name: Build (release + wic)
        run: cargo build --release --features wic

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $zipName = "ArcThumb-$version-portable-x64.zip"
          $staging = "target\portable-staging"

          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # Core binaries
          Copy-Item "target\release\arcthumb.dll"        $staging
          Copy-Item "target\release\arcthumb-config.exe"  $staging

          # License files
          Copy-Item "LICENSE-MIT"     $staging
          Copy-Item "LICENSE-APACHE"  $staging

          # Create zip
          Compress-Archive -Path "$staging\*" -DestinationPath "target\$zipName" -Force

          Write-Host "Created: target\$zipName"
          Write-Host "Size: $((Get-Item "target\$zipName").Length / 1KB) KB"

          # Export for upload step
          "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ env.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
