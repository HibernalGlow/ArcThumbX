# CI: build, test, format and clippy on every push and PR.
#
# Runs only on windows-latest because ArcThumb is a Windows shell
# extension and there is no point compiling it elsewhere.
#
# Clippy runs with `-D warnings`: the codebase is warning-clean and
# any new warning fails the build.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Avoid spending CI minutes on stale pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (debug)
        run: cargo test

      # The `wic` feature is off by default, so the steps above never
      # compile decode.rs's WIC path. Build and test it explicitly
      # here, otherwise a breaking windows-rs WIC API change passes CI
      # unnoticed.
      - name: Test (wic feature)
        run: cargo test --features wic

      - name: Build (release)
        run: cargo build --release
